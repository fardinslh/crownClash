services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crownclash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crownclash}
      POSTGRES_DB: crownclash
    volumes:
      - crownclash_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crownclash -d crownclash']
      interval: 5s
      timeout: 5s
      retries: 10

  nakama-migrate:
    build:
      context: .
      dockerfile: apps/server-nakama/Dockerfile
    entrypoint:
      - '/nakama/nakama'
      - 'migrate'
      - 'up'
      - '--database.address=crownclash:${POSTGRES_PASSWORD:-crownclash}@db:5432/crownclash'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  nakama:
    build:
      context: .
      dockerfile: apps/server-nakama/Dockerfile
    restart: unless-stopped
    entrypoint:
      - '/nakama/nakama'
      - '--name=crownclash'
      - '--runtime.path=/nakama/data/modules'
      - '--database.address=crownclash:${POSTGRES_PASSWORD:-crownclash}@db:5432/crownclash'
      - '--runtime.env=ALLOW_GUEST_AUTH=${ALLOW_GUEST_AUTH:-false}'
      - '--runtime.env=TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}'
      - '--runtime.env=BALE_BOT_TOKEN=${BALE_BOT_TOKEN:-}'
      - '--runtime.env=INIT_DATA_MAX_AGE_SECONDS=${INIT_DATA_MAX_AGE_SECONDS:-86400}'
      - '--socket.server_key=${NAKAMA_SERVER_KEY:-defaultkey}'
      - '--session.token_expiry_sec=7200'
      - '--logger.level=INFO'
      - '--console.username=${NAKAMA_CONSOLE_USER:-admin}'
      - '--console.password=${NAKAMA_CONSOLE_PASSWORD:?NAKAMA_CONSOLE_PASSWORD is required}'
    ports:
      - '7348:7348'
      - '7350:7350'
      - '7351:7351'
    healthcheck:
      test: ['CMD', '/nakama/nakama', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      nakama-migrate:
        condition: service_completed_successfully

  game:
    build:
      context: .
      dockerfile: apps/game/Dockerfile
      args:
        VITE_NAKAMA_HOST: ${VITE_NAKAMA_HOST:-}
        VITE_NAKAMA_PORT: ${VITE_NAKAMA_PORT:-7350}
        VITE_NAKAMA_SSL: ${VITE_NAKAMA_SSL:-false}
        VITE_NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:-defaultkey}
    restart: unless-stopped
    depends_on:
      - nakama

volumes:
  crownclash_pg_data:
