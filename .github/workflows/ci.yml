# Crown Clash CI
#
# Job 1 (build-test-parity): fast fail-fast gate — npm ci, production build,
#   unit tests, typecheck, Go server tests, the cross-engine bot parity
#   harness (TypeScript client simulation vs the real Go authoritative replay,
#   executed in the pinned golang container via Docker), and the fast
#   numerical boundary audit (cross-engine float-determinism check over the
#   shared simulation decision boundaries).
# Job 2 (real-stack): boots the repository Docker Compose Nakama/PostgreSQL
#   stack from the checked-out source, waits deterministically for health, and
#   runs the real-stack regression suites (live PvP smoke + bot settlement
#   parity). Prints compose logs on failure and always tears the stack down.
#
# The pinned versions mirror the development toolchain: Node 26 (current
# release line, verified with 26.8.x) and Go 1.26.5 (must match the Nakama
# 3.40.0 plugin toolchain, see apps/server-nakama/Dockerfile).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-parity:
    name: Build, unit tests, typecheck, cross-engine parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: apps/server-nakama/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Go server tests
        run: go test ./...
        working-directory: apps/server-nakama

      - name: Build production Nakama plugin
        run: go build -trimpath -buildmode=plugin -o /tmp/crownclash.so .
        working-directory: apps/server-nakama

      - name: Cross-engine bot parity (TypeScript vs real Go replay)
        run: npm run test:parity
        env:
          CROSS_ENGINE_GO_MODE: host

      - name: Cross-engine 2v2 parity (TypeScript vs real Go replay)
        run: npm run test:parity:2v2
        env:
          CROSS_ENGINE_GO_MODE: host

      - name: Numerical boundary audit
        run: npm run test:audit -- --fast
        env:
          CROSS_ENGINE_GO_MODE: host

  real-stack:
    name: Real Nakama/Postgres stack regression
    runs-on: ubuntu-latest
    needs: build-test-parity
    env:
      # Test-stack configuration mirroring the local development .env: the
      # regression suites authenticate browser test players, and compose
      # requires an explicit console password.
      ALLOW_GUEST_AUTH: 'true'
      NAKAMA_CONSOLE_PASSWORD: ci-stack-console-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game client and shared core
        run: npm run build

      - name: Start Nakama/Postgres stack from checked-out source
        run: docker compose up -d --build

      - name: Wait for Nakama health
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            if curl -fsS http://127.0.0.1:7350/ > /dev/null 2>&1; then
              echo "Nakama healthy after ${SECONDS}s"
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          echo "Nakama did not become healthy within 180s" >&2
          docker compose ps -a
          exit 1

      - name: Live PvP smoke suite (real stack)
        run: npm run test:smoke

      - name: Bot settlement parity suite (real stack)
        run: npm run test:bot

      - name: Print compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down stack, volumes, and orphans
        if: always()
        run: docker compose down -v --remove-orphans
